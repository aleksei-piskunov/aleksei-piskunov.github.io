title: ALEKSEI PISKUNOV - MATH
description: Personal academic website of Aleksei Piskunov, a PhD student in mathematics at the Technion.
url: "https://aleksei-piskunov.github.io"
baseurl: ""
lang: en
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: [apos, apos, quot, quot]
permalink: pretty
defaults:
  - scope:
      path: ""
    values:
      layout: page
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - MIGRATION.md
  - vendor
  - preview
  - scripts
  - AGENTS.md
  - github-pages-source.zip
